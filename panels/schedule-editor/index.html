<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schema-editor — Tekniska Museet</title>
<style>
  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --surface2:  #232635;
    --border:    #2e3248;
    --accent:    #4f8ef7;
    --accent-dim:#2a4a8a;
    --success:   #3ecf8e;
    --danger:    #f75f5f;
    --warn:      #f5a623;
    --text:      #e8eaf0;
    --text-muted:#8890aa;
    --radius:    8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ── Header ────────────────────────────────────────────────── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-logo-img {
    height: 26px;
    width: auto;
    flex-shrink: 0;
    display: block;
  }
  .header-title {
    color: var(--text-muted);
    font-size: 13px;
    flex-shrink: 0;
  }
  .header-spacer { flex: 1; }
  .btn-admin-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 17px;
    cursor: pointer;
    line-height: 1;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .btn-admin-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .btn-admin-toggle.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Status bar ─────────────────────────────────────────────── */
  .status-bar {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 13px;
    min-height: 42px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .status-dot.ok   { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .status-dot.err  { background: var(--danger);  box-shadow: 0 0 6px var(--danger); }
  .status-dot.warn { background: var(--warn);    box-shadow: 0 0 6px var(--warn); }
  .status-conn { display: flex; align-items: center; gap: 8px; }
  .status-live { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .status-live .badge {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 12px;
    color: var(--text);
  }
  .status-live .badge.active { border-color: var(--success); color: var(--success); }
  .status-live .badge.next   { border-color: var(--accent);  color: var(--accent); }

  /* ── Layout ─────────────────────────────────────────────────── */
  .main {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ── Card ───────────────────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-header-note {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    color: var(--text-muted);
  }
  .card-body { padding: 20px; }

  /* ── Form elements ──────────────────────────────────────────── */
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  input[type="text"],
  input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 9px 12px;
    font-size: 14px;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* ── Buttons ────────────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
    user-select: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { opacity: 0.88; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn-danger-ghost {
    background: transparent;
    border: 1px solid transparent;
    color: var(--danger);
    padding: 4px 8px;
    font-size: 16px;
  }
  .btn-danger-ghost:hover { background: rgba(247,95,95,0.12); border-color: var(--danger); }
  .btn-success { background: var(--success); color: #0a1a11; }
  .btn-success:hover:not(:disabled) { opacity: 0.88; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }

  /* ── Inline day chips (per slot) ────────────────────────────── */
  .slot-days {
    display: flex;
    flex-wrap: nowrap;
    gap: 3px;
    align-items: center;
    flex-shrink: 0;
  }
  .slot-day-chip { position: relative; }
  .slot-day-chip input[type="checkbox"] { display: none; }
  .slot-day-chip label {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 26px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0;
    text-transform: none;
    margin: 0;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    user-select: none;
  }
  .slot-day-chip input:checked + label {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Times table ────────────────────────────────────────────── */
  .times-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .times-header h3 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  #times-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }
  .time-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    flex-wrap: wrap;
  }
  .time-row-idx {
    font-size: 11px;
    color: var(--text-muted);
    width: 18px;
    text-align: right;
    flex-shrink: 0;
  }
  .time-row .time-input {
    width: 82px;
    flex-shrink: 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    padding: 0 0 2px;
    font-family: var(--font);
    outline: none;
    cursor: text;
  }
  .time-row .time-input:focus { border-bottom-color: var(--accent); }
  .time-row .time-input.invalid { color: var(--danger); border-bottom-color: var(--danger); }
  .time-row .name-input {
    flex: 1;
    min-width: 90px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text);
    padding: 0 4px 2px;
    font-family: var(--font);
    outline: none;
    cursor: text;
  }
  .time-row .name-input:focus { border-bottom-color: var(--accent); }
  .time-row .name-input::placeholder { color: var(--text-muted); font-style: italic; }
  .time-row .dur-input {
    width: 38px;
    flex-shrink: 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
    text-align: right;
    padding: 0 2px 2px;
    font-family: var(--font);
    outline: none;
    -moz-appearance: textfield;
  }
  .time-row .dur-input:focus { border-bottom-color: var(--accent); }
  .time-row .dur-input::-webkit-outer-spin-button,
  .time-row .dur-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .dur-suffix {
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  /* ── Admin panel — event types ──────────────────────────────── */
  #event-types-list {
    display: flex;
    flex-direction: column;
    margin-bottom: 14px;
  }
  .et-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  .et-row:last-child { border-bottom: none; }
  .et-row .et-name {
    flex: 1;
    width: auto;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    color: var(--text);
    padding: 0 4px 2px;
    font-family: var(--font);
    outline: none;
  }
  .et-row .et-name:focus { border-bottom-color: var(--accent); }
  .et-row .et-name::placeholder { color: var(--text-muted); font-style: italic; }
  .et-row .et-dur {
    width: 46px;
    flex-shrink: 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
    text-align: right;
    padding: 0 2px 2px;
    font-family: var(--font);
    outline: none;
    -moz-appearance: textfield;
  }
  .et-row .et-dur:focus { border-bottom-color: var(--accent); }
  .et-row .et-dur::-webkit-outer-spin-button,
  .et-row .et-dur::-webkit-inner-spin-button { -webkit-appearance: none; }
  .et-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }

  /* ── Timeline preview ───────────────────────────────────────── */
  .timeline-wrap {
    position: relative;
    height: 72px;
    margin-top: 4px;
  }
  .timeline-track {
    position: absolute;
    top: 28px;
    left: 0; right: 0;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
  }
  .timeline-labels { position: absolute; top: 0; left: 0; right: 0; }
  .timeline-markers { position: absolute; top: 0; left: 0; right: 0; height: 100%; }
  .t-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    position: absolute;
    top: 22px;
    transform: translateX(-50%);
  }
  .t-dot.active-dot {
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    width: 12px; height: 12px;
    top: 21px;
  }
  .t-active-bar {
    position: absolute;
    top: 26px;
    height: 8px;
    background: rgba(62,207,142,0.25);
    border-radius: 4px;
    border: 1px solid var(--success);
  }
  .t-label {
    position: absolute;
    transform: translateX(-50%);
    top: 40px;
    font-size: 9px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .t-label.active-label { color: var(--success); font-weight: 700; }
  .t-tick-minor {
    position: absolute;
    top: 26px;
    width: 1px;
    height: 4px;
    background: var(--border);
    transform: translateX(-50%);
  }
  .timeline-day-note {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
  }

  /* ── Toast ──────────────────────────────────────────────────── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 14px;
    color: var(--text);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 1000;
    max-width: 360px;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.toast-ok   { border-color: var(--success); color: var(--success); }
  #toast.toast-err  { border-color: var(--danger);  color: var(--danger); }
  #toast.toast-warn { border-color: var(--warn);    color: var(--warn); }

  /* ── Footer actions ─────────────────────────────────────────── */
  .actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    flex-wrap: wrap;
  }
  .actions-info { flex: 1; font-size: 12px; color: var(--text-muted); }

  /* ── Spinner ────────────────────────────────────────────────── */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Misc ───────────────────────────────────────────────────── */
  .section-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .text-muted { color: var(--text-muted); }
  .text-success { color: var(--success); }
  .text-danger { color: var(--danger); }
</style>
</head>

      <div class="timeline-wrap" id="timeline">
        <div class="timeline-track"></div>
        <div class="timeline-labels" id="tl-labels"></div>
        <div class="timeline-markers" id="tl-markers"></div>
      </div>
      <div class="timeline-day-note" id="tl-day-note"></div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <span class="actions-info" id="last-saved"></span>
    <button class="btn btn-ghost" id="btn-reload">Hämta om schema</button>
    <button class="btn btn-success" id="btn-save">Spara schema</button>
  </div>

</div>

<!-- Shared datalist for event names -->
<datalist id="show-names-list"></datalist>

<!-- Toast -->
<div id="toast"></div>

<script>
'use strict';

/* ─── Constants ─────────────────────────────────────────── */
const DAY_KEYS   = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_LABELS = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
const TIMELINE_START = 8;
const TIMELINE_END   = 22;

/* ─── State ──────────────────────────────────────────────── */
let schedule      = null;
let pubSubInstance = null;
let eventTypes    = [
  { name: 'AV-Verk', defaultDuration: 15 },
  { name: 'Test',    defaultDuration: 10 }
];

/* ─── DOM refs ───────────────────────────────────────────── */
const $connDot      = document.getElementById('conn-dot');
const $connText     = document.getElementById('conn-text');
const $badgeActive  = document.getElementById('badge-active');
const $badgeNext    = document.getElementById('badge-next');
const $timesList    = document.getElementById('times-list');
const $noTimes      = document.getElementById('no-times');
const $btnAdd       = document.getElementById('btn-add-time');
const $btnSave      = document.getElementById('btn-save');
const $btnReload    = document.getElementById('btn-reload');
const $lastSaved    = document.getElementById('last-saved');
const $tlLabels     = document.getElementById('tl-labels');
const $tlMarkers    = document.getElementById('tl-markers');
const $tlDayNote    = document.getElementById('tl-day-note');
const $previewLabel = document.getElementById('preview-label');
const $toast        = document.getElementById('toast');
const $adminPanel   = document.getElementById('admin-panel');
const $btnAdmin     = document.getElementById('btn-admin');
const $etList       = document.getElementById('event-types-list');
const $btnAddET     = document.getElementById('btn-add-event-type');

/* ─── Helpers ────────────────────────────────────────────── */
function pad2(n) { return String(n).padStart(2,'0'); }

function timeToMinutes(hhmm) {
  const [h,m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function nowMinutes() {
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}

function todayDayKey() {
  const d = new Date().getDay();
  return DAY_KEYS[d === 0 ? 6 : d - 1];
}

function todayDayLabel() {
  const d = new Date().getDay();
  return DAY_LABELS[d === 0 ? 6 : d - 1];
}

let toastTimeout;
function showToast(msg, type = 'ok', duration = 3000) {
  $toast.textContent = msg;
  $toast.className = 'show toast-' + type;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { $toast.className = ''; }, duration);
}

/* ─── Event types (admin) ────────────────────────────────── */

function updateDatalist() {
  const list = document.getElementById('show-names-list');
  list.innerHTML = '';
  eventTypes.forEach(et => {
    if (!et.name) return;
    const opt = document.createElement('option');
    opt.value = et.name;
    list.appendChild(opt);
  });
}

function renderAdminList(types) {
  $etList.innerHTML = '';
  (types || []).forEach(et => addEventTypeRow(et.name, et.defaultDuration));
}

function addEventTypeRow(name, dur) {
  const row = document.createElement('div');
  row.className = 'et-row';

  const nameInp = document.createElement('input');
  nameInp.type = 'text';
  nameInp.placeholder = 'Eventnamn';
  nameInp.maxLength = 64;
  nameInp.className = 'et-name';
  nameInp.value = name || '';
  nameInp.addEventListener('input', () => {
    syncEventTypesFromUI();
    updateDatalist();
  });

  const durInp = document.createElement('input');
  durInp.type = 'number';
  durInp.placeholder = '15';
  durInp.min = 1;
  durInp.max = 480;
  durInp.className = 'et-dur';
  durInp.value = dur > 0 ? dur : '';
  durInp.addEventListener('input', () => syncEventTypesFromUI());

  const suffix = document.createElement('span');
  suffix.className = 'dur-suffix';
  suffix.textContent = 'min';

  const del = document.createElement('button');
  del.className = 'btn btn-danger-ghost';
  del.title = 'Ta bort';
  del.textContent = '×';
  del.addEventListener('click', () => {
    row.remove();
    syncEventTypesFromUI();
    updateDatalist();
  });

  row.appendChild(nameInp);
  row.appendChild(durInp);
  row.appendChild(suffix);
  row.appendChild(del);
  $etList.appendChild(row);
}

function syncEventTypesFromUI() {
  eventTypes = Array.from($etList.querySelectorAll('.et-row')).map(row => ({
    name:            row.querySelector('.et-name').value.trim(),
    defaultDuration: parseInt(row.querySelector('.et-dur').value, 10) || 0
  })).filter(et => et.name);
}

function getEventTypesFromUI() {
  syncEventTypesFromUI();
  return eventTypes;
}

/* ─── Admin panel toggle ─────────────────────────────────── */
$btnAdmin.addEventListener('click', () => {
  const hidden = $adminPanel.style.display === 'none';
  $adminPanel.style.display = hidden ? '' : 'none';
  $btnAdmin.classList.toggle('active', hidden);
});

$btnAddET.addEventListener('click', () => {
  addEventTypeRow('', 0);
  const last = $etList.lastElementChild;
  if (last) last.querySelector('.et-name').focus();
});

/* ─── Inline day chips for a slot row ───────────────────── */
function buildSlotDayChips(rowId, selectedDays) {
  const wrap = document.createElement('div');
  wrap.className = 'slot-days';
  DAY_KEYS.forEach((key, i) => {
    const chip = document.createElement('div');
    chip.className = 'slot-day-chip';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = rowId + '-day-' + key;
    cb.value = key;
    cb.checked = Array.isArray(selectedDays) && selectedDays.includes(key);
    cb.addEventListener('change', updateTimeline);
    const lbl = document.createElement('label');
    lbl.htmlFor = rowId + '-day-' + key;
    lbl.textContent = DAY_LABELS[i];
    chip.appendChild(cb);
    chip.appendChild(lbl);
    wrap.appendChild(chip);
  });
  return wrap;
}

function getSlotDays(row) {
  return DAY_KEYS.filter(k => {
    const cb = row.querySelector('input[type="checkbox"][value="' + k + '"]');
    return cb && cb.checked;
  });
}

/* ─── Times list ─────────────────────────────────────────── */
function renderTimesList(slots) {
  $timesList.innerHTML = '';
  slots.forEach((slot, i) => {
    addTimeRow(slot.time, slot.days, slot.name, slot.duration, i + 1);
  });
  updateNoTimesMsg();
  updateTimeline();
}

let _rowCounter = 0;

function addTimeRow(timeValue, selectedDays, nameValue, durationValue, idx) {
  _rowCounter++;
  const rowId = 'tr' + _rowCounter;

  const row = document.createElement('div');
  row.className = 'time-row';
  row.dataset.rowId = rowId;

  const idxLabel = document.createElement('span');
  idxLabel.className = 'time-row-idx';
  idxLabel.textContent = (idx != null ? idx : $timesList.children.length + 1);

  const timeInp = document.createElement('input');
  timeInp.type = 'text';
  timeInp.placeholder = 'HH:MM';
  timeInp.pattern = '[0-2][0-9]:[0-5][0-9]';
  timeInp.maxLength = 5;
  timeInp.className = 'time-input';
  timeInp.value = timeValue || '';
  timeInp.addEventListener('input', () => {
    // Auto-insert colon after 2 digits while typing
    if (/^\d{2}$/.test(timeInp.value)) {
      timeInp.value = timeInp.value + ':';
    }
  });
  timeInp.addEventListener('change', () => { updateTimeline(); renumberRows(); });
  timeInp.addEventListener('blur', () => {
    let v = timeInp.value.trim();
    // "1400" or "930" → "14:00" / "09:30"
    if (/^\d{3,4}$/.test(v)) {
      if (v.length === 3) v = '0' + v;
      v = v.slice(0, 2) + ':' + v.slice(2);
      timeInp.value = v;
    }
    // "9:00" → "09:00"
    if (/^\d:[0-5]\d$/.test(v)) { timeInp.value = '0' + v; v = timeInp.value; }
    if (timeInp.value && !/^([01]\d|2[0-3]):[0-5]\d$/.test(timeInp.value)) {
      timeInp.classList.add('invalid');
    } else {
      timeInp.classList.remove('invalid');
    }
    updateTimeline();
    renumberRows();
  });

  const dayChips = buildSlotDayChips(rowId, selectedDays || []);

  // Duration input — create before nameInp so we can reference it in closure
  const durInp = document.createElement('input');
  durInp.type = 'number';
  durInp.placeholder = '15';
  durInp.min = 1;
  durInp.max = 480;
  durInp.className = 'dur-input';
  durInp.value = durationValue != null && durationValue > 0 ? durationValue : '';
  durInp.addEventListener('input', updateTimeline);

  const nameInp = document.createElement('input');
  nameInp.type = 'text';
  nameInp.placeholder = 'Eventnamn';
  nameInp.maxLength = 64;
  nameInp.className = 'name-input';
  nameInp.setAttribute('list', 'show-names-list');
  nameInp.value = nameValue || '';
  nameInp.addEventListener('input', updateTimeline);
  nameInp.addEventListener('change', () => {
    // Auto-fill duration from eventTypes when a name is selected
    const selected = nameInp.value.trim();
    const match = eventTypes.find(et => et.name === selected);
    if (match && match.defaultDuration > 0) {
      durInp.value = match.defaultDuration;
    }
    updateTimeline();
  });

  const durSuffix = document.createElement('span');
  durSuffix.className = 'dur-suffix';
  durSuffix.textContent = 'min';

  const del = document.createElement('button');
  del.className = 'btn btn-danger-ghost';
  del.title = 'Ta bort';
  del.textContent = '×';
  del.addEventListener('click', () => {
    row.remove();
    renumberRows();
    updateNoTimesMsg();
    updateTimeline();
  });

  row.appendChild(idxLabel);
  row.appendChild(timeInp);
  row.appendChild(dayChips);
  row.appendChild(nameInp);
  row.appendChild(durInp);
  row.appendChild(durSuffix);
  row.appendChild(del);
  $timesList.appendChild(row);
}

function renumberRows() {
  Array.from($timesList.children).forEach((row, i) => {
    row.querySelector('.time-row-idx').textContent = i + 1;
  });
}

function updateNoTimesMsg() {
  $noTimes.style.display = $timesList.children.length === 0 ? '' : 'none';
}

function getTimesFromUI() {
  return Array.from($timesList.children)
    .map(row => {
      const timeInp = row.querySelector('.time-input');
      const nameInp = row.querySelector('.name-input');
      const durInp  = row.querySelector('.dur-input');
      const raw  = timeInp ? timeInp.value.trim() : '';
      const time = /^([01]\d|2[0-3]):[0-5]\d$/.test(raw) ? raw : '';
      const days = getSlotDays(row);
      const name = nameInp ? nameInp.value.trim() : '';
      const duration = durInp ? (parseInt(durInp.value, 10) || 0) : 0;
      return { time, days, name, duration };
    })
    .filter(s => s.time)
    .sort((a, b) => a.time.localeCompare(b.time));
}

/* ─── Timeline ───────────────────────────────────────────── */
function updateTimeline() {
  const slots    = getTimesFromUI();
  const totalMin = (TIMELINE_END - TIMELINE_START) * 60;

  $tlLabels.innerHTML  = '';
  $tlMarkers.innerHTML = '';

  for (let h = TIMELINE_START; h <= TIMELINE_END; h++) {
    const pct = ((h - TIMELINE_START) * 60 / totalMin) * 100;
    const lbl = document.createElement('span');
    lbl.style.cssText = 'position:absolute;left:' + pct + '%;transform:translateX(-50%);font-size:10px;color:var(--text-muted);top:0';
    lbl.textContent = pad2(h) + ':00';
    $tlLabels.appendChild(lbl);

    const tick = document.createElement('div');
    tick.className = 't-tick-minor';
    tick.style.left = pct + '%';
    $tlMarkers.appendChild(tick);
  }

  const nowMin   = nowMinutes();
  const todayKey = todayDayKey();
  const todaySlots = slots.filter(s => s.days.includes(todayKey));

  todaySlots.forEach(slot => {
    const startMin = timeToMinutes(slot.time);
    const duration = slot.duration || 0;
    if (startMin < TIMELINE_START * 60 || startMin > TIMELINE_END * 60) return;

    const pct = ((startMin - TIMELINE_START * 60) / totalMin) * 100;
    const isActive = duration > 0 && nowMin >= startMin && nowMin < startMin + duration;

    if (isActive) {
      const endMin = Math.min(startMin + duration, TIMELINE_END * 60);
      const pctEnd = ((endMin - TIMELINE_START * 60) / totalMin) * 100;
      const bar = document.createElement('div');
      bar.className = 't-active-bar';
      bar.style.left  = pct + '%';
      bar.style.width = (pctEnd - pct) + '%';
      $tlMarkers.appendChild(bar);
    }

    const dot = document.createElement('div');
    dot.className = 't-dot' + (isActive ? ' active-dot' : '');
    dot.style.left = pct + '%';
    $tlMarkers.appendChild(dot);

    const lbl = document.createElement('span');
    lbl.className = 't-label' + (isActive ? ' active-label' : '');
    lbl.style.left = pct + '%';
    lbl.textContent = slot.name || slot.time;
    $tlMarkers.appendChild(lbl);
  });

  const dayLabel = todayDayLabel();
  $previewLabel.textContent = 'Event idag — ' + dayLabel;
  $tlDayNote.textContent = 'Visar tider för ' + dayLabel;
}

/* ─── PubSub live status ─────────────────────────────────── */
let liveScheduleEvent = '';
let liveNextEvent     = '';
let liveNextEventName = '';

function updateLiveStatusBadges() {
  if (liveScheduleEvent && liveScheduleEvent.trim() !== '') {
    $badgeActive.textContent   = '▶ Pågår: ' + liveScheduleEvent;
    $badgeActive.className     = 'badge active';
    $badgeActive.style.display = '';
  } else {
    $badgeActive.style.display = 'none';
  }
  if (liveNextEvent && liveNextEvent.trim() !== '') {
    const prefix = liveNextEventName ? liveNextEventName + ' ' : '';
    $badgeNext.textContent   = 'Nästa: ' + prefix + liveNextEvent;
    $badgeNext.className     = 'badge next';
    $badgeNext.style.display = '';
  } else {
    $badgeNext.style.display = 'none';
  }
}

async function initPubSub() {
  try {
    const mod  = await import('./PubSubWebBlock.js');
    pubSubInstance = new mod.default();
    const pubSub = pubSubInstance;

    pubSub.subscribe('Script.user.ScheduleManager.scheduleEvent', {
      dataReceived(value) {
        liveScheduleEvent = (value !== undefined && value !== null) ? String(value) : '';
        updateLiveStatusBadges();
      }
    });
    pubSub.subscribe('Script.user.ScheduleManager.nextEvent', {
      dataReceived(value) {
        liveNextEvent = (value !== undefined && value !== null) ? String(value) : '';
        updateLiveStatusBadges();
      }
    });
    pubSub.subscribe('Script.user.ScheduleManager.nextEventName', {
      dataReceived(value) {
        liveNextEventName = (value !== undefined && value !== null) ? String(value) : '';
        updateLiveStatusBadges();
      }
    });

    $connDot.className    = 'status-dot ok';
    $connText.textContent = 'Live-status aktiv';
    $connText.className   = 'text-success';
  } catch(e) {
    $connDot.className    = 'status-dot warn';
    $connText.textContent = 'Live-status ej tillgänglig';
    $connText.className   = 'text-muted';
    console.warn('PubSub init failed:', e);
  }
}

/* ─── API calls ──────────────────────────────────────────── */
async function fetchSchedule() {
  const resp = await fetch('/public/schedule-editor/schedule.json');
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
  return resp.json();
}

async function postSchedule(data) {
  const resp = await fetch('/rest/script/invoke/ScheduleManager/setSchedule', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
  return resp.text();
}

/* ─── Load schedule into UI ──────────────────────────────── */
function applySchedule(data) {
  schedule = data;

  // Load event types
  if (Array.isArray(data.eventTypes) && data.eventTypes.length > 0) {
    eventTypes = data.eventTypes;
  }
  renderAdminList(eventTypes);
  updateDatalist();

  // Load slots
  let slots = [];
  if (Array.isArray(data.slots)) {
    slots = data.slots;
  } else if (data.events && data.events[0]) {
    const evt = data.events[0];
    if (Array.isArray(evt.slots)) {
      slots = evt.slots.map(s => ({
        time: s.time, days: s.days || evt.days || [],
        name: evt.name || '', duration: evt.duration || 0
      }));
    } else if (Array.isArray(evt.times)) {
      slots = evt.times.map(t => ({
        time: t, days: evt.days || [],
        name: evt.name || '', duration: evt.duration || 0
      }));
    }
  }
  renderTimesList(slots);
}

/* ─── Build payload from UI ──────────────────────────────── */
function buildPayload() {
  const slots = getTimesFromUI();
  if (slots.length === 0) throw new Error('Lägg till minst en visningstid.');
  const hasAnyDay = slots.some(s => s.days.length > 0);
  if (!hasAnyDay) throw new Error('Välj minst en aktiv dag för någon tid.');
  return { eventTypes: getEventTypesFromUI(), slots };
}

/* ─── Event handlers ─────────────────────────────────────── */
$btnReload.addEventListener('click', async () => {
  $btnReload.disabled = true;
  $btnReload.innerHTML = '<span class="spinner"></span>';
  try {
    const data = await fetchSchedule();
    applySchedule(data);
    showToast('Schema hämtat.', 'ok');
  } catch(e) {
    showToast('Fel vid hämtning: ' + e.message, 'err', 5000);
  } finally {
    $btnReload.disabled = false;
    $btnReload.textContent = 'Hämta om schema';
  }
});

$btnSave.addEventListener('click', async () => {
  let payload;
  try { payload = buildPayload(); }
  catch(e) { showToast(e.message, 'warn', 4000); return; }

  $btnSave.disabled = true;
  $btnSave.innerHTML = '<span class="spinner"></span> Sparar…';
  try {
    await postSchedule(payload);
    schedule = payload;
    const now = new Date();
    $lastSaved.textContent = 'Sparat ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());
    showToast('Schema sparat!', 'ok');
    updateTimeline();
  } catch(e) {
    showToast('Fel vid sparning: ' + e.message, 'err', 5000);
  } finally {
    $btnSave.disabled = false;
    $btnSave.textContent = 'Spara schema';
  }
});

$btnAdd.addEventListener('click', () => {
  addTimeRow('', [], '', null, $timesList.children.length + 1);
  updateNoTimesMsg();
  updateTimeline();
  const last = $timesList.lastElementChild;
  if (last) last.querySelector('.time-input').focus();
});

/* ─── Init ───────────────────────────────────────────────── */
renderAdminList(eventTypes);
updateDatalist();
renderTimesList([]);
updateTimeline();
initPubSub();

(async () => {
  try {
    const data = await fetchSchedule();
    applySchedule(data);
  } catch(e) {
    showToast('Kunde inte hämta schema: ' + e.message, 'err', 5000);
  }
})();

setInterval(updateTimeline, 60 * 1000);
</script>
</body>
</html>
